name: House Price MLOps CI

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Verify project imports
        run: |
          python -c "from house_price.pipeline.predict_pipeline import PredictPipeline; print('Import successful')"


      - name: Build Docker Image
        run: |
          docker build -t house-price-mlops .